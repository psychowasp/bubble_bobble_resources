<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Bub the Dragon — Bubble Bobble
    Mouth closed (idle / walking)
  -->

  <!-- ── TAIL (rendered behind body) ────────────────────────────── -->
  <!-- black outline layer (ends before yellow tip) -->
  <path d="M 318 405 C 382 450 456 450 477 410 C 498 372 486 328 462 306"
        fill="none" stroke="#000" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- green fill layer -->
  <path d="M 318 405 C 382 450 456 450 477 410 C 498 372 486 328 462 306"
        fill="none" stroke="#3cb830" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- yellow spike tip — pointed teardrop shape -->
  <path d="M 448 314 Q 438 272 468 250 Q 485 274 472 312 Z"
        fill="#f8d000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
  <!-- spike tip highlight -->
  <ellipse cx="462" cy="274" rx="7" ry="14" fill="#ffe462" opacity="0.65"
           transform="rotate(-8 462 274)"/>
  <!-- tail highlight -->
  <path d="M 340 420 C 390 450 444 446 464 418"
        fill="none" stroke="#55d845" stroke-width="10" stroke-linecap="round" opacity="0.45"/>

  <!-- ── BACK SPIKES (behind head, tips protrude outside head radius) ── -->
  <!-- Spike 2 — upper right of head -->
  <path d="M 292 93 L 370 56 L 326 118 Z"
        fill="#f8d000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="341" cy="84" rx="12" ry="19" fill="#ffe462" opacity="0.60"
           transform="rotate(-32 341 84)"/>

  <!-- Spike 3 — right of head -->
  <path d="M 340 174 L 406 195 L 342 220 Z"
        fill="#f8d000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="376" cy="190" rx="10" ry="16" fill="#ffe462" opacity="0.60"
           transform="rotate(-85 376 190)"/>

  <!-- Spike 4 — lower right, between head and body -->
  <path d="M 262 312 L 350 272 L 286 330 Z"
        fill="#f8d000" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="316" cy="302" rx="9" ry="15" fill="#ffe462" opacity="0.60"
           transform="rotate(-48 316 302)"/>

  <!-- ── BODY ─────────────────────────────────────────────────────── -->
  <ellipse cx="215" cy="395" rx="115" ry="100"
           fill="#3cb830" stroke="#000" stroke-width="12"/>
  <!-- body highlight -->
  <ellipse cx="186" cy="353" rx="38" ry="28" fill="#5de048" opacity="0.38"/>

  <!-- ── WHITE BELLY ─────────────────────────────────────────────── -->
  <ellipse cx="205" cy="402" rx="68" ry="83"
           fill="#eef3ff" stroke="#000" stroke-width="7"/>
  <!-- belly inner highlight -->
  <ellipse cx="196" cy="370" rx="28" ry="33" fill="#ffffff" opacity="0.55"/>

  <!-- ── LEFT ARM (behind head, in front of body) ───────────────── -->
  <ellipse cx="90" cy="418" rx="42" ry="46"
           fill="#ee7080" stroke="#000" stroke-width="11"
           transform="rotate(-18 90 418)"/>
  <!-- knuckle bumps -->
  <circle cx="72"  cy="435" r="9" fill="#f8a0aa" opacity="0.75"/>
  <circle cx="88"  cy="445" r="9" fill="#f8a0aa" opacity="0.75"/>
  <circle cx="106" cy="441" r="9" fill="#f8a0aa" opacity="0.75"/>

  <!-- ── TOP SPIKE (drawn before head so head covers its base) ───── -->
  <path d="M 174 56 L 210 17 L 248 56 Z"
        fill="#f8d000" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="210" cy="37" rx="9" ry="17" fill="#ffe462" opacity="0.65"/>

  <!-- ── HEAD ──────────────────────────────────────────────────────── -->
  <circle cx="210" cy="195" r="145"
          fill="#3cb830" stroke="#000" stroke-width="12"/>
  <!-- head highlight -->
  <ellipse cx="174" cy="146" rx="53" ry="43" fill="#5de048" opacity="0.34"/>

  <!-- ── CHEEK SPOTS ────────────────────────────────────────────── -->
  <ellipse cx="128" cy="246" rx="27" ry="20" fill="#f8d000" stroke="#000" stroke-width="5"/>
  <ellipse cx="120" cy="240" rx="11" ry="8"  fill="#ffe462" opacity="0.72"/>

  <ellipse cx="268" cy="238" rx="27" ry="20" fill="#f8d000" stroke="#000" stroke-width="5"/>
  <ellipse cx="260" cy="232" rx="11" ry="8"  fill="#ffe462" opacity="0.72"/>

  <!-- ── EYES ───────────────────────────────────────────────────── -->
  <!-- left eye white -->
  <ellipse cx="162" cy="182" rx="44" ry="53" fill="#ffffff" stroke="#000" stroke-width="8"/>
  <!-- left pupil -->
  <ellipse cx="165" cy="191" rx="29" ry="38" fill="#0a0a28"/>
  <!-- left pupil blue-dark sheen -->
  <ellipse cx="168" cy="194" rx="20" ry="28" fill="#12124a"/>
  <!-- left highlight -->
  <ellipse cx="152" cy="172" rx="11" ry="14" fill="#ffffff"/>

  <!-- right eye white -->
  <ellipse cx="244" cy="178" rx="40" ry="50" fill="#ffffff" stroke="#000" stroke-width="8"/>
  <!-- right pupil -->
  <ellipse cx="247" cy="186" rx="26" ry="35" fill="#0a0a28"/>
  <!-- right pupil sheen -->
  <ellipse cx="250" cy="189" rx="18" ry="25" fill="#12124a"/>
  <!-- right highlight -->
  <ellipse cx="235" cy="167" rx="9" ry="12" fill="#ffffff"/>

  <!-- ── CLOSED SMILE + TWO TEETH ──────────────────────────────── -->
  <!-- smile arc -->
  <path d="M 177 274 Q 198 296 222 276"
        fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <!-- left tooth -->
  <path d="M 188 274 L 188 288 Q 194 294 200 288 L 200 274 Z"
        fill="#ffffff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <!-- right tooth -->
  <path d="M 202 274 L 202 287 Q 208 293 214 287 L 214 274 Z"
        fill="#ffffff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>

  <!-- ── RIGHT ARM (rendered in front of body) ─────────────────── -->
  <ellipse cx="345" cy="408" rx="42" ry="46"
           fill="#ee7080" stroke="#000" stroke-width="11"
           transform="rotate(15 345 408)"/>
  <!-- knuckle bumps -->
  <circle cx="364" cy="422" r="9" fill="#f8a0aa" opacity="0.75"/>
  <circle cx="350" cy="434" r="9" fill="#f8a0aa" opacity="0.75"/>
  <circle cx="334" cy="432" r="9" fill="#f8a0aa" opacity="0.75"/>

  <!-- ── FEET ───────────────────────────────────────────────────── -->
  <!-- left foot body -->
  <ellipse cx="148" cy="472" rx="46" ry="25" fill="#3cb830" stroke="#000" stroke-width="10"/>
  <!-- left foot pad -->
  <ellipse cx="148" cy="482" rx="36" ry="17" fill="#ee7080" stroke="#000" stroke-width="5"/>
  <!-- toe highlights -->
  <circle cx="130" cy="481" r="6" fill="#f8a0aa" opacity="0.55"/>
  <circle cx="148" cy="484" r="6" fill="#f8a0aa" opacity="0.55"/>
  <circle cx="166" cy="481" r="6" fill="#f8a0aa" opacity="0.55"/>

  <!-- right foot body -->
  <ellipse cx="272" cy="476" rx="46" ry="25" fill="#3cb830" stroke="#000" stroke-width="10"/>
  <!-- right foot pad -->
  <ellipse cx="272" cy="486" rx="36" ry="17" fill="#ee7080" stroke="#000" stroke-width="5"/>
  <!-- toe highlights -->
  <circle cx="254" cy="485" r="6" fill="#f8a0aa" opacity="0.55"/>
  <circle cx="272" cy="488" r="6" fill="#f8a0aa" opacity="0.55"/>
  <circle cx="290" cy="485" r="6" fill="#f8a0aa" opacity="0.55"/>

  <!-- ── BODY + TAIL SPOTS ──────────────────────────────────────── -->
  <circle cx="288" cy="356" r="10" fill="#5de048" opacity="0.65"/>
  <circle cx="302" cy="377" r="8"  fill="#5de048" opacity="0.65"/>
  <circle cx="278" cy="381" r="7"  fill="#5de048" opacity="0.65"/>
  <circle cx="438" cy="374" r="7"  fill="#5de048" opacity="0.60"/>
  <circle cx="454" cy="354" r="5"  fill="#5de048" opacity="0.60"/>
</svg>
